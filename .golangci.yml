# golangci-lint configuration (v1 schema).
#
# Kept intentionally close to the defaults plus formatting and spelling checks,
# so the linter flags real problems instead of style preferences.
run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
  disable:
    - depguard

linters-settings:
  errcheck:
    # CLI tools intentionally ignore write errors on std streams and help text.
    exclude-functions:
      - fmt.Fprint
      - fmt.Fprintf
      - fmt.Fprintln
      - (io.Writer).Write

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
